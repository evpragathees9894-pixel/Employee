<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory — Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">👥</div>

        <div>
            <h1>Employee Directory</h1>
            <p>Manage your team with ease</p>
        </div>
    </div>

    <div class="header-actions">
        <button class="refresh-btn" onclick="refreshPage()">↻</button>
        <button class="add-btn" onclick="openAddEmployee()">
            ＋ Add Employee
        </button>
    </div>

</header>


<main class="container">

    <!-- DASHBOARD CARDS -->

    <section class="stats">

        <div class="stat-card">
            <div class="stat-icon blue">👥</div>
            <h2 id="totalEmployees">0</h2>
            <p>Total Employees</p>
        </div>

        <div class="stat-card">
            <div class="stat-icon green">👤</div>
            <h2 id="activeEmployees">0</h2>
            <p>Active</p>
        </div>

        <div class="stat-card">
            <div class="stat-icon orange">🏢</div>
            <h2 id="departmentCount">0</h2>
            <p>Departments</p>
        </div>

        <div class="stat-card">
            <div class="stat-icon purple">📈</div>
            <h2 id="averageSalary">$0</h2>
            <p>Avg. Salary</p>
        </div>

    </section>


    <!-- SEARCH AND FILTER -->

    <section class="toolbar">

        <div class="search-box">
            🔍
            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, email, position..."
                onkeyup="displayEmployees()"
            >
        </div>

        <div class="filters">

            <select id="departmentFilter" onchange="displayEmployees()">
                <option value="all">All Departments</option>
            </select>

            <select id="statusFilter" onchange="displayEmployees()">
                <option value="all">All Status</option>
                <option value="Active">Active</option>
                <option value="On Leave">On Leave</option>
                <option value="Inactive">Inactive</option>
            </select>

            <button class="view-btn active" onclick="showList()">☷</button>
            <button class="view-btn" onclick="showGrid()">▦</button>

        </div>

    </section>


    <p class="result">
        Showing <b id="shownCount">0</b>
        of <b id="allCount">0</b> employees
    </p>


    <!-- EMPLOYEE TABLE -->

    <section class="table-card">

        <table id="employeeTable">

            <thead>

                <tr>
                    <th>Employee</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Salary</th>
                    <th>Status</th>
                    <th>Hire Date</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="employeeBody"></tbody>

        </table>

    </section>


    <!-- GRID VIEW -->

    <section id="gridView" class="employee-grid"></section>

</main>


<!-- ADD / EDIT POPUP -->

<div id="employeeModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <div>
                <h2 id="modalTitle">Add Employee</h2>
                <p>Enter employee information below.</p>
            </div>

            <button onclick="closeModal()" class="close-btn">×</button>

        </div>


        <form id="employeeForm">

            <input type="hidden" id="employeeId">

            <div class="form-grid">

                <div>
                    <label>Full Name</label>
                    <input id="name" required>
                </div>

                <div>
                    <label>Email</label>
                    <input id="email" type="email" required>
                </div>

                <div>
                    <label>Department</label>
                    <input id="department" required>
                </div>

                <div>
                    <label>Position</label>
                    <input id="position" required>
                </div>

                <div>
                    <label>Salary</label>
                    <input id="salary" type="number" required>
                </div>

                <div>
                    <label>Status</label>

                    <select id="status">

                        <option value="Active">
                            Active
                        </option>

                        <option value="On Leave">
                            On Leave
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>

                <div>
                    <label>Hire Date</label>
                    <input id="hireDate" type="date" required>
                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn">
                    Save Employee
                </button>

            </div>

        </form>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
